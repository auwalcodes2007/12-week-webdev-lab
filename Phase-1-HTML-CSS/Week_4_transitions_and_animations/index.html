<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <style>
        .box {
            position: relative;
            width: 100px;
            height: 100px;
            background-color: blue;
            transition: background-color 3s, left 3s ease-in-out;
            left: 50px;
        }
        .box:hover {
            background-color: red;
            left: 90px;
        }
        .box1 {
            width: 100px;
            height: 100px;
            background-color: red;
            transition: width 2s;
        }
        .box1:hover {
            width: 200px
        }
    </style>
</head>
<body>
    <div class="box"></div> <br>
    <div class="box1"></div> <br>
    <div class="box2"></div>
</body>
</html>
