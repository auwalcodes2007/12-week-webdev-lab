<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* Centers the ball on the screen */
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f7f9fc;
      }

      /* Defines the stage size */
      .stage {
        width: 200px;
        height: 300px;
        position: relative;
        border-bottom: 3px solid #333; /* Floor line */
      }

      /* Designs the physical ball */
      .ball {
        width: 50px;
        height: 50px;
        background-color: #ff4757;
        border-radius: 50%; /* Makes the div a circle */
        position: absolute;
        bottom: 0; /* Starts at the bottom */
        left: calc(50% - 25px); /* Centers horizontally */

        /* Triggers the animation named 'bounce' */
        animation: bounce 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite
          alternate;
      }

      /* Creates the physics movement */
      @keyframes bounce {
        0% {
          transform: translateY(0) scaleY(0.8) scaleX(1.2); /* Squish on impact */
        }
        10% {
          transform: translateY(0) scaleY(1) scaleX(1); /* Return to normal shape */
        }
        100% {
          transform: translateY(-200px); /* Peak height of the bounce */
        }
      }
    </style>
  </head>

  <body>
    <div class="stage">
      <div class="ball"></div>
    </div>
  </body>
</html>
