<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Beautiful Animated Form</title>

    <style>
      /* Modern Reset & Base Design */

      * {
        margin: 0;

        padding: 0;

        box-sizing: border-box;

        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        display: flex;

        justify-content: center;

        align-items: center;

        min-height: 100vh;

        background: #0f172a;

        overflow: hidden;

        position: relative;
      }

      /* Animated Background Blobs */

      body::before,
      body::after {
        content: "";

        position: absolute;

        width: 300px;

        height: 300px;

        border-radius: 50%;

        background: linear-gradient(45deg, #1e40af, #3b82f6);

        animation: floatBackground 12s infinite alternate ease-in-out;

        z-index: 1;

        filter: blur(80px);

        opacity: 0.5;
      }

      body::after {
        background: linear-gradient(45deg, #ec4899, #8b5cf6);

        animation-delay: -6s;

        right: 15%;

        top: 15%;
      }

      body::before {
        left: 15%;

        bottom: 15%;
      }

      @keyframes floatBackground {
        0% {
          transform: translateY(0) scale(1);
        }

        100% {
          transform: translateY(50px) scale(1.2);
        }
      }

      /* Card Container with Interactive Depth */

      .form-container {
        position: relative;

        width: 400px;

        padding: 40px;

        background: rgba(255, 255, 255, 0.03);

        border: 1px solid rgba(255, 255, 255, 0.1);

        border-radius: 20px;

        backdrop-filter: blur(16px);

        box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);

        z-index: 10;

        transition:
          transform 0.4s cubic-bezier(0.25, 1, 0.5, 1),
          border-color 0.4s,
          box-shadow 0.4s;
      }

      /* Subtle tilt/lift container animation on hover */

      .form-container:hover {
        transform: translateY(-5px);

        border-color: rgba(255, 255, 255, 0.2);

        box-shadow: 0 30px 60px rgba(59, 130, 246, 0.15);
      }

      .form-container h2 {
        color: #ffffff;

        font-weight: 600;

        letter-spacing: 1px;

        margin-bottom: 30px;

        text-align: center;
      }

      /* Form Layout */

      .input-group {
        position: relative;

        margin-bottom: 25px;
      }

      /* Floating Label & Field Elements */

      .input-group input {
        width: 100%;

        padding: 12px 16px;

        background: rgba(255, 255, 255, 0.05);

        outline: none;

        border: 1px solid rgba(255, 255, 255, 0.15);

        border-radius: 8px;

        color: #fff;

        font-size: 16px;

        transition: all 0.3s ease;
      }

      .input-group label {
        position: absolute;

        left: 16px;

        top: 50%;

        transform: translateY(-50%);

        color: rgba(255, 255, 255, 0.5);

        transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);

        pointer-events: none;

        font-size: 15px;
      }

      /* Micro-Interactions on Field Input */

      .input-group input:hover {
        background: rgba(255, 255, 255, 0.08);

        border-color: rgba(255, 255, 255, 0.3);
      }

      .input-group input:focus {
        border-color: #3b82f6;

        background: rgba(15, 23, 42, 0.6);

        box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
      }

      /* Float the label up permanently when input contains text or is focused */

      .input-group input:focus ~ label,
      .input-group input:valid ~ label {
        top: -10px;

        left: 10px;

        font-size: 12px;

        padding: 0 8px;

        color: #3b82f6;

        background: #0f172a;

        border-radius: 4px;
      }

      /* Utility Elements */

      .forget-options {
        display: flex;

        justify-content: space-between;

        align-items: center;

        margin-bottom: 25px;

        color: rgba(255, 255, 255, 0.7);

        font-size: 14px;
      }

      .forget-options label {
        display: flex;

        align-items: center;

        gap: 6px;

        cursor: pointer;
      }

      .forget-options input[type="checkbox"] {
        accent-color: #3b82f6;

        cursor: pointer;
      }

      .forget-options a {
        color: #3b82f6;

        text-decoration: none;

        transition: color 0.2s;
      }

      .forget-options a:hover {
        color: #60a5fa;

        text-decoration: underline;
      }

      /* Core Button with Shifting Gradient Hover Effect */

      .submit-btn {
        width: 100%;

        padding: 14px;

        border: none;

        outline: none;

        border-radius: 8px;

        font-size: 16px;

        font-weight: 600;

        color: #fff;

        cursor: pointer;

        background: linear-gradient(90deg, #3b82f6, #8b5cf6, #3b82f6);

        background-size: 200% auto;

        box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);

        transition:
          transform 0.2s,
          background-position 0.5s ease,
          box-shadow 0.3s;
      }

      .submit-btn:hover {
        background-position: right center; /* Moves the gradient pattern */

        box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6);

        transform: scale(1.02);
      }

      .submit-btn:active {
        transform: scale(0.98);
      }

      /* Bottom Alternate Links */

      .register-link {
        margin-top: 25px;

        text-align: center;

        color: rgba(255, 255, 255, 0.6);

        font-size: 14px;
      }

      .register-link a {
        color: #ec4899;

        text-decoration: none;

        font-weight: 600;

        transition: color 0.2s;
      }

      .register-link a:hover {
        color: #f472b6;

        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="form-container">
      <h2>Account Login</h2>

      <form action="#" method="POST" autocomplete="off">
        <div class="input-group">
          <input type="email" id="email" required />

          <label for="email">Email Address</label>
        </div>

        <div class="input-group">
          <input type="password" id="password" required />

          <label for="password">Password</label>
        </div>

        <div class="forget-options">
          <label> <input type="checkbox" /> Remember me </label>

          <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="submit-btn">Sign In</button>

        <div class="register-link">
          <p>Don't have an account? <a href="#">Register now</a></p>
        </div>
      </form>
    </div>
  </body>
</html>
